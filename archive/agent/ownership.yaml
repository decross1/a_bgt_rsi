# Machine-readable ownership registry for concurrent agent coordination.
#
# Every file in the repo maps to exactly ONE zone. A glob conflict (two
# zones covering the same path) is a planning bug — `tools/claims_check.py
# --validate-ownership` will exit non-zero if found.
#
# Fields per zone:
#   id            — stable identifier; referenced by plan.yaml `target_zone:`
#   paths         — glob patterns this zone covers
#   primary_track — default writer when no dispatch is active (A/B/C/D)
#   dispatchable  — may an orchestrator-dispatched coding agent claim this zone?
#                   (Track A's zones are never dispatchable — Track A is the
#                   integrator and writes by primacy, not by claim.)
#
# Read by: agent sessions before any file write; tools/claims_check.py;
# tools/dispatch_coding_agent.py (Day-39 deliverable).
#
# Authoritative for ownership. Where this file disagrees with prose in
# agent/orchestration.md, this file wins.

zones:
  # ──────────────────────────────────────────────────────────────────
  # Track A (Main) — apparatus integrator. Never dispatched.
  # ──────────────────────────────────────────────────────────────────
  - id: orchestrator
    paths:
      - "orchestrator/**"
      - "workers/**"
      - "agent_wrapper/**"
    primary_track: A
    dispatchable: false

  - id: state-file
    paths:
      - "run_state/week1.state.json"
      - "run_state/week1.run.jsonl"
      - "run_state/.gitkeep"
      - "run_state/vllm_image.digest"
    primary_track: A
    dispatchable: false

  - id: bench-and-logs
    paths:
      - "bench/**"
      - "logs/**"
    primary_track: A
    dispatchable: false

  - id: chroma-store
    paths:
      - "chroma_db/**"
    primary_track: A
    dispatchable: false

  - id: setup-scripts
    paths:
      - "setup/**"
    primary_track: A
    dispatchable: false
    notes: |
      One-shot install / serve scripts (day1_docker_config.sh,
      day1_vllm_serve.sh, day2_vllm_serve_mtp.sh, day3_chroma.sh,
      day4_vllm_serve_tools.sh). Track A primacy; never dispatched —
      these scripts touch the live vLLM endpoint and the install
      environment.

  - id: repo-config
    paths:
      - ".env.example"
      - ".gitignore"
      - ".worktreeinclude"
      - "plan.yaml"
      - "requirements.txt"
    primary_track: A
    dispatchable: false
    notes: |
      Repo-root configuration. Track A primacy; never dispatched.
      plan.yaml is read-only for non-Track-A agents per
      agent/orchestration.md hard rule 5.

  # ──────────────────────────────────────────────────────────────────
  # Track B — tests & schemas. Dispatchable.
  # ──────────────────────────────────────────────────────────────────
  - id: schemas
    paths:
      - "schema/**"
    primary_track: B
    dispatchable: true

  - id: tests-shared
    paths:
      - "tests/test_*.py"
      - "tests/_*.py"
      - "tests/needle_in_haystack.py"
      - "tests/example_call.jsonl"
      - "tests/.gitkeep"
    primary_track: B
    dispatchable: true

  - id: tests-fixtures
    paths:
      - "tests/fixtures/**"
    primary_track: C
    dispatchable: true
    notes: |
      Track-C fixture drops (e.g. critic-flaw hypothesis fixtures for
      Day 39's W2-01, calibration fixtures for Day 41's W2-05).
      Distinct from tests-shared so Track-B test scaffolds and
      Track-C fixture drops do not collide.

  # ──────────────────────────────────────────────────────────────────
  # Track C — pipeline & ops. Dispatchable.
  # ──────────────────────────────────────────────────────────────────
  - id: pipeline
    paths:
      - "pipeline/**"
      - "ingest/**"
    primary_track: C
    dispatchable: true

  - id: cron-and-scripts
    paths:
      - "cron/**"
      - "scripts/**"
    primary_track: C
    dispatchable: true

  - id: experiments
    paths:
      - "experiments/exp001_repeated_pd/*.py"
      - "experiments/exp001_repeated_pd/.gitkeep"
      - "experiments/exp001_repeated_pd/experiment.lock"
      - "experiments/exp001_repeated_pd/analysis/**"
      - "experiments/exp001_repeated_pd/results/**"
      - "experiments/exp001_repeated_pd/results_*/**"
      - "experiments/exp001_repeated_pd/plots/**"
      - "experiments/fixtures/**"
    primary_track: C
    dispatchable: true
    notes: |
      Day-7 slip-rerun result dirs (results_7_1/, results_7_2/,
      results_7_3/) are covered by the results_*/** pattern (D-029).
      experiments/fixtures/** added 2026-05-24 to cover Track-C's
      Day-8 fixture deliverable (critic_hypotheses/ + novelty_calibration/);
      this extension is recorded inline in D-029's operational notes
      rather than its own decision entry.

  - id: tools
    paths:
      - "tools/**"
    primary_track: C
    dispatchable: true

  - id: infra
    paths:
      - "infra/**"
    primary_track: C
    dispatchable: true

  # ──────────────────────────────────────────────────────────────────
  # Track D — UI / observability. Dispatchable.
  # ──────────────────────────────────────────────────────────────────
  - id: ui
    paths:
      - "ui/**"
      - "ui_plan.md"
    primary_track: D
    dispatchable: true

  # ──────────────────────────────────────────────────────────────────
  # Shared — multi-track JSONL append-only logs.
  # ──────────────────────────────────────────────────────────────────
  - id: shared-jsonl
    paths:
      - "run_state/attestations.jsonl"
      - "run_state/escalations.jsonl"
      - "run_state/claims.jsonl"
    primary_track: shared
    dispatchable: false
    notes: |
      Append-only by ALL agents. Track A rectifies if a malformed
      line appears; otherwise no one rewrites these files.

  # ──────────────────────────────────────────────────────────────────
  # Documentation — collaborative; claim-protocol mandatory.
  # ──────────────────────────────────────────────────────────────────
  - id: docs-root
    paths:
      - "ARCHITECTURE.md"
      - "CLAUDE.md"
      - "current_day.md"
      - "DECISIONS.md"
      - "GLOSSARY.md"
      - "PHASE_1_ROADMAP.md"
      - "PROJECT_CONTEXT.md"
      - "README.md"
      - "START_HERE.md"
      - "week2_plan_seed.md"
    primary_track: A
    dispatchable: true
    notes: |
      Root-level project documentation. Enumerated explicitly to avoid
      fnmatch glob over-match — D-029 documents why the original `*.md`
      pattern collided with every `.md` file in the repo
      (fnmatch.fnmatch treats `*` as matching `/`). Docs are
      dispatchable but conflict-prone — claim protocol is mandatory
      before any write. Track A is the default writer. ui_plan.md
      belongs to the ui zone (Track D).

  - id: docs-human
    paths:
      - "human/**"
    primary_track: A
    dispatchable: true
    notes: |
      Human-facing docs. Track A writes by default; dispatched agents
      may claim individual files.

  - id: docs-agent
    paths:
      - "agent/**"
    primary_track: A
    dispatchable: true
    notes: |
      Agent-facing docs. Track A writes by default; dispatched agents
      may claim individual files. Changes to autonomy.md and
      ownership.yaml require a D-NNN entry (architectural decision).

  - id: docs-tree
    paths:
      - "docs/**"
    primary_track: A
    dispatchable: true
    notes: |
      Everything under docs/ — architecture diagrams (SVGs from
      D-024 / D-025 architecture v5 adoption) plus source-paper
      reference notes. Track A by default; dispatched agents may
      claim individual files when adding new diagrams or source
      summaries.

  - id: journal
    paths:
      - "journal/**"
    primary_track: A
    dispatchable: true
    notes: |
      Public daily / weekly journal posts. Track A drafts the
      data-insert stub during Block 3; the human writes the prose.
      Dispatched agents may draft individual posts but the human
      authors the final text.

  - id: notes
    paths:
      - "notes/**"
    primary_track: any
    dispatchable: true
    notes: |
      Working notes. Any agent may write; convention is one file
      per agent-task (notes/<track>-<dayN>-<topic>.md or
      notes/<agent-id>.log).

# ──────────────────────────────────────────────────────────────────────
# Conflict-resolution rules (when two claims race for the same file)
# ──────────────────────────────────────────────────────────────────────
conflict_resolution:
  - rule: track_a_primacy
    description: |
      Track A's primary zones (orchestrator, state-file, bench-and-logs,
      chroma-store, setup-scripts, repo-config) are NEVER dispatched.
      Any claim entry for a path in these zones by a non-Track-A
      agent is a protocol violation; tools/claims_check.py flags it.
  - rule: first_claim_wins
    description: |
      For dispatchable zones, the first non-expired claim wins. Later
      claimants wait or escalate.
  - rule: doc_conflicts
    description: |
      For docs-root, docs-human, docs-agent: if two agents claim the
      same file within a 10-minute window, both abort and the human
      arbitrates. This is rare in practice because dispatched docs
      tasks are usually scoped to disjoint sections.
  - rule: integration_wins
    description: |
      Track A's version of any conflicting file wins at merge time
      regardless of claim order. This matches CLAUDE.md inviolate rule
      on parallel-track merges.

# ──────────────────────────────────────────────────────────────────────
# Versioning
# ──────────────────────────────────────────────────────────────────────
schema_version: 2
last_updated: "2026-05-24"
