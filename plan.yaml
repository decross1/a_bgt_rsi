## day_3_5: retroactive amendments from adversarial review (D-024 / D-025)

```yaml
day_id: day_3_5
program_day: 33.5
date_offset: T+2.5
inserted: 2026-05-20
inserted_by: code-review and adversarial-review integration
inserted_reason: |
  The 2026-05-19 adversarial architecture review (see
  notes/research/2026-05-19-adversarial-review/) surfaced three additive
  schema changes that amend Day-2 JSONL deliverables which have already
  shipped (retrieval_context field on call records; human_intervention
  and calibration_entry typed events on a sibling events.jsonl). Per the
  user's direction "amendments to day 1, 2, or 3 go in as a new day 3.5,"
  these are scheduled here rather than back-edited into Days 1-3 or
  deferred to Week 2. Day 3.5 does NOT alter any Day 1-3 success
  criteria, version pins, hard checkpoints, or human-only blocks; it is
  strictly additive.
success_criterion: |
  schema/calls.jsonl.schema.json carries the optional retrieval_context
  field; schema/events.jsonl.schema.json exists and validates the two
  new typed events; the wrapper passes a (possibly null) retrieval_context
  through to the log; tests for both schemas pass.
