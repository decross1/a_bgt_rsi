# Appendix A — Deviations from research program v2

> Copied verbatim from the source plan's "Cross-cutting notes" section
> ("Where this plan extends or deviates from the research program
> document"). Preserved as appendix, NOT converted to tasks.

1. **Embedding model**: Program does not specify; this plan pins BGE-M3
   per validation pass adjustment 1.
2. **Synthetic tier engine**: Program doesn't specify implementation;
   this plan uses OpenSpiel + Game Reasoning Arena per adjustment 3
   (saves 1-2 weeks).
3. **CUDA pinning**: Program is hardware-agnostic; this plan adds
   explicit CUDA 13.0 pin and auto-update lock per adjustment 4 (avoids
   documented CUDA 13.2 gibberish bug on low-bit quants).
4. **Qwen 3.6**: Program lists multiple models; this plan defers Qwen 3.6
   introduction to Week 2-3 per adjustment 2 (avoids configuration
   matrix masking bugs in Week 1).
5. **NemoClaw fallback**: Program assumes NemoClaw works; this plan
   reserves a plain-Docker fallback path per validation pass risk #1
   (NemoClaw is alpha as of May 2026).
6. **Daily journal cadence**: Program calls for weekly synthesis posts;
   this plan has a daily 200-500 word public post from Block 3, with the
   Day 7 weekly synthesis at the longer 600-1000 word target. The daily
   posts make the apparatus's outputs the primary research data, per
   program's stated intent.
7. **Day 7 human-review gate**: Program's Day 7 ladder says "first
   synthetic-tier experiment, full logs captured, behavior compared to
   fixed strategies." This plan adds the explicit graduated-autonomy
   gate: results are not published the same day; human review precedes
   publication. This implements the "graduated autonomy architecture"
   principle from the user's existing system memory.

**What this plan deliberately does NOT do in Week 1:**

- No Polymarket API calls. Polymarket is design-only in Phase 1 per the
  program; live calls are Phase 2-3.
- No autoresearch overnight runs. Defer to Week 2 — too much variance
  with the rest of the stack still settling.
- No second model. Qwen 3.6 deferred per adjustment 2.
- No concurrency. Sequential workers only on Day 6.
- No fully autonomous loop. Day 7 produces a result that requires human
  review.
- No fine-tuning.

