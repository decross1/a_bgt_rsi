- task_id: day3_block2_chunking_and_ingest_script
  type: agent_assisted
  human_only: false
  description: |
    Chunking strategy + ingest script. Strategy: semantic chunking by
    section/subsection (PDF table of contents → boundaries); fallback to
    fixed 1500-token / 200-overlap when ToC absent. NEVER split
    mid-equation: regex guard for unmatched `$...$`,
    `\begin{equation}` / `\end{equation}` pairs. `ingest/textbook.py`:
    input PDF → chunks → ChromaDB with metadata (book, chapter, section,
    page range, chunk index). (Source 0:20–0:50.)
  preconditions:
    - day3_block2_chroma_install
  command: null  # Implementation is human / sub-agent; the agent here
                 # runs the dry-run validation only.
  expected_observable:
    kind: file_exists
    value: ingest/textbook.py and ingest/chunking.py with the equation-guard regex
  validation:
    - check: dry-run on Osborne Ch. 1 only
      pass_signal: |
        `python3 ingest/textbook.py --pdf books/osborne_rubinstein.pdf
         --chapters 1 --dry-run` prints chunk count, mean length, max
         length; 5 random chunks contain no broken `$...$` or unmatched
         equation environments
      fail_signal: any chunk shows mid-equation break OR script errors
  on_failure:
    action: escalate_to_human
    human_message: |
      Equation-guard regex did not catch a mid-equation split. Tighten
      regex; re-run dry-run before full ingest. The full ingest is the
      next task — do not proceed until dry-run is clean.
  hard_checkpoint: false
  estimated_minutes: 30
  log_to: run_log

- task_id: day3_block2_full_ingest
  type: agent_executable
  human_only: false
  description: |
    Full Osborne & Rubinstein ingest. Run on full PDF (you've read
    Ch 1-5; embedding the whole book gives the loop access to Ch 6-8 —
    that's intentional). Expect ~1500–3000 chunks; ~50 MB embedding
    storage. (Source 0:50–1:30.)
  preconditions:
    - day3_block2_chunking_and_ingest_script
  command: |
    python3 ingest/textbook.py --pdf books/osborne_rubinstein.pdf \
      --collection osborne_rubinstein \
      --output-manifest chroma_db/manifest.json
  expected_observable:
    kind: metric_threshold
    value: |
      Collection count in [1500, 3000]; query "subgame perfect
      equilibrium" returns top-1 from Ch 6-7.
  validation:
    - check: chunk count in expected range
      pass_signal: collection count in [1500, 3000]
      fail_signal: count outside band
    - check: relevant retrieval works
      pass_signal: query "subgame perfect equilibrium" returns top-1
        result with chapter metadata in {6, 7}
      fail_signal: top-1 not from Ch 6-7
  on_failure:
    action: escalate_to_human
    human_message: |
      Ingest count or retrieval out of expected band. Investigate
      chunking aggressiveness or check that BGE-M3 is actually loaded
      (re-run the day3_block2_chroma_install validation).
  hard_checkpoint: false
  estimated_minutes: 40
  log_to: run_log

- task_id: day3_block2_needle_haystack
  type: agent_executable
  human_only: false
  description: |
    Needle-in-haystack benchmark. Insert a known synthetic sentence
    into an 8K-token chunk: "The Schelling-Hardin lemma states that
    goats prefer left turns." Query "Schelling-Hardin lemma" → expected
    top-1 retrieval, score ≥ 0.6 (BGE-M3 should hit ~0.92 at 8K per
    validation pass). (Source 1:30–2:00.)
  preconditions:
    - day3_block2_full_ingest
  command: |
    python3 tests/needle_in_haystack.py \
      --collection day3_needle_test \
      --needle "The Schelling-Hardin lemma states that goats prefer left turns." \
      --haystack-tokens 8000 \
      --output bench/day3_needle.json
  expected_observable:
    kind: metric_threshold
    value: |
      Top-1 retrieval score ≥ 0.85 → proceed; < 0.7 → investigate.
      ≥ 0.6 is the floor; BGE-M3 expected to hit ~0.92.
  validation:
    - check: top-1 retrieval is the needle sentence
      pass_signal: top-1 hit's text contains "Schelling-Hardin lemma"
      fail_signal: top-1 is some other passage
    - check: top-1 score ≥ 0.85 (proceed band)
      pass_signal: score ≥ 0.85 → record and proceed
      fail_signal: score < 0.85 → investigate before Day 4
    - check: top-1 score not below 0.7 (investigation floor)
      pass_signal: score ≥ 0.7
      fail_signal: score < 0.7 — investigate: chunking too aggressive,
        wrong embedding actually loaded, collection rebuilt without
        BGE-M3
  on_failure:
    action: escalate_to_human
    human_message: |
      Needle score below 0.7. Investigation order:
        1. Was the collection actually rebuilt with BGE-M3? Re-check
           manifest.json.
        2. Is chunking splitting the needle from its surrounding 8K
           context? Inspect the chunks containing the needle.
        3. Is the haystack actually 8K tokens?
      Do not advance to Day 4 with a broken retrieval layer.
  hard_checkpoint: false
  estimated_minutes: 30
  log_to: run_log
  metric_log_key: day3_needle_score
```

