# Appendix C — Agent operating rules (concise restatement)

**1. No Block 1.**
Every Block 1 task is `human_only: true`. The agent prints the reading
and problem set, sets a wall-clock timer, and HALTS. The agent does not
execute, assist, summarize, derive, or solve. This rule does not bend.
There is no "let the agent help just this once" condition.

**2. Version pins are inviolate.**
- vLLM image: `vllm/vllm-openai:v0.21.0` (NOT `:gemma4`,
  `:gemma4-cu130`, or `:v0.20.0` — see D-022; enables Gemma 4 MTP).
- OpenShell cluster: `ghcr.io/nvidia/openshell/cluster:0.0.13`.
- CUDA: 13.0 (NOT 13.2 — gibberish on low-bit quants).
- Embedding: BGE-M3 (NOT all-MiniLM-L6-v2).
- vLLM MoE backend flag: `--moe-backend marlin`; startup log MUST
  contain `Using 'MARLIN' NvFp4 MoE backend`. If the log shows
  `CUTLASS_FP4`, the flag did not pick up — STOP.
- Weights path: `/mnt/models/gemma-4-26b-a4b-nvfp4` (NVFP4, not BF16).
- MTP drafter: `google/gemma-4-26B-A4B-it-assistant` staged at
  `/mnt/models/gemma-4-26b-a4b-it-assistant` (BF16, ~870 MB). Pair only
  with the IT target — pairing with a base target is a 38% slowdown.

**3. Human gates are blocking.**
The Day 7 publication review gate (`day7_publication_review_gate`) is
the most important. The agent does NOT auto-publish results. The agent
HALTS and prints the gate notice. The gate clears only when a human
explicitly marks it complete; the agent does not poll, infer, or
proceed.

**4. Validations are never silently coerced.**
Each bullet under a source "Validation:" line is a separate check with
its own `pass_signal` / `fail_signal`. Mismatches between
`expected_observable` and actual output are reported; they are never
recoded as passes. "Below band but close" is a failure unless the
source explicitly bands it as informational.

**5. State file is authoritative on resume.**
At startup, the agent reads `./run_state/week1.state.json` and resumes
at the first incomplete task in `current_day`. Earlier days are not
re-run. `human_gates_pending` is honored across restarts.

**6. Hard checkpoints abort the day.**
Tasks tagged `hard_checkpoint: true` write `day_aborted` to the run log
on failure and halt the day. The next day's Block 2 is gated on the
prior day's success unless the source explicitly allows continuation.

**7. Fallbacks are explicit, logged, and time-capped.**
NemoClaw → plain Docker (90-min cap, Day 1). ML-Intern → direct
Semantic Scholar API (45-min cap, Day 5). OpenClaw+NemoClaw → Python
multiprocessing (Day 6). Each fallback selection writes to
`state.fallbacks_taken`.

**8. Logging is mandatory.**
Every agent-executable task appends to `./run_state/week1.run.jsonl`
with `{timestamp, day_id, task_id, status, observable_actual,
observable_expected, duration_ms}`. State transitions and fallback
selections are logged as their own entries.

**9. Code-generation is bounded.**
The source plan is explicit that code beyond simple validation is out
of scope for this conversion. Tasks marked `agent_assisted` with
`command: null` indicate the agent prepares scaffolding only; the
human (or a sub-agent with explicit file-write authority) writes the
implementation.

**10. The retrospective is the human's.**
On Day 7, the agent prints the retrospective questions and appends the
human's answers to the run log. The agent does NOT write, summarize,
or interpret the retrospective.

**11. Track boundaries are enforced.**
Track A may write anywhere. Tracks B and C may write only the paths in
their `file_writes` allowlist (see the `parallel_execution` frontmatter
block and `agent/orchestration.md`). A side track that writes outside its
allowlist must STOP, revert the unauthorized changes, and refuse to
commit. The human audits boundary violations and tightens the
side-track system prompt.

**12. Side tracks never call the LLM.**
`LOCAL_LLM_BASE_URL` is reserved for Track A. Tracks B and C set
`MOCK_LLM=1` in their environment and any test that would otherwise
hit the endpoint stubs the response. A side track that attempts a real
LLM call must STOP and surface the attempt to the human.

**13. Merge order is deterministic.**
Side-track branches are merged by Track A in the order their
`consumed_by` task is scheduled. The merge happens BEFORE Track A
starts the consuming task, so Track A validates merged files as inputs
rather than authoring them under time pressure.

**14. Side tracks do not advance the day.**
Only Track A updates `state.current_day` and `state.completed_tasks`.
Side-track completion is signaled by a string in stdout, not a state
update. Track A records the merge in `run_state/week1.run.jsonl` as a
`side_track_merged` event.