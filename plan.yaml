### block_2_build (2 hr, agent_executable)

```yaml
- task_id: day4_block2_mock_tool
  type: agent_assisted
  human_only: false
  description: |
    Mock tool definition. One tool: `get_payoff_matrix(game_name: str)
    -> dict` returning fixed matrices for `prisoners_dilemma`,
    `stag_hunt`, `matching_pennies`. Tool schema in OpenAI
    function-calling JSON format. Implementation: ~20 lines, hardcoded
    dicts. (Source 0:00–0:30.)
  preconditions: []
  recommended_reading: [day4_block1_reading]   # informational only; does NOT gate execution
  autonomy_tier: soft_gate
  autonomy_tier_after_unlock: autonomous
  target_zone: tools
  dispatchable: true
  command: null  # Authoring step. Agent runs unit test below after.
  expected_observable:
    kind: file_exists
    value: tools/mock_payoffs.py with get_payoff_matrix; tools/mock_payoffs.schema.json
  validation:
    - check: unit test the tool function directly
      pass_signal: |
        `python3 -c "from tools.mock_payoffs import get_payoff_matrix; m=get_payoff_matrix('prisoners_dilemma'); import json; json.dumps(m)"`
        exits 0 and returns a dict containing payoffs (3,3),(0,5),(5,0),(1,1)
      fail_signal: not JSON-serializable OR matrix wrong
    - check: schema is OpenAI function-calling format
      pass_signal: |
        schema has `type: "function"`, a `function` object with `name`,
        `description`, and `parameters` (JSON Schema)
      fail_signal: shape doesn't match
  on_failure:
    action: retry_once
    human_message: |
      Mock tool implementation incomplete or schema malformed. Re-author
      per the source's exact specification — three games, hardcoded
      matrices.
  hard_checkpoint: false
  estimated_minutes: 30
  log_to: run_log

- task_id: day4_block2_wrapper_tools
  type: agent_assisted
  human_only: false
  description: |
    Wire into wrapper. Extend `wrapper.py` with `call_with_tools(
    messages, tools)`: send initial request with `tools` parameter;
    if `tool_calls` non-empty, schema-validate args, execute tool,
    append `role: "tool"` message with result, recurse (max depth 3).
    Log every step to JSONL with `parent_request_id` linking the chain.
    (Source 0:30–1:15.)
  preconditions:
    - day4_block2_mock_tool
  command: null  # Wrapper extension is authored; validation is the
                 # end-to-end test below.
  expected_observable:
    kind: file_exists
    value: agent_wrapper/wrapper.py exposing call_with_tools
  validation:
    - check: schema-validate tool_calls field on every response
      pass_signal: |
        Wrapper logs schema validation outcome per response; malformed
        JSON is logged and surfaced — NOT silently retried on Day 1
        of tool calling.
      fail_signal: silent retry on malformed JSON
    - check: max recursion depth 3
      pass_signal: function signature or constant enforces depth ≤ 3
      fail_signal: no depth bound
  on_failure:
    action: escalate_to_human
    human_message: |
      Wrapper tool-call extension does not surface malformed JSON. You
      need to SEE the failure rate today. Do not silently retry until
      you've measured.
  hard_checkpoint: false
  estimated_minutes: 45
  log_to: run_log

- task_id: day4_block2_e2e_test
  type: agent_executable
  human_only: false
  description: |
    End-to-end test. Prompt: "What is the payoff matrix for prisoner's
    dilemma? Use the available tool to answer accurately." Expected:
    Gemma calls `get_payoff_matrix(game_name="prisoners_dilemma")`,
    gets result, summarizes in natural language. (Source 1:15–1:50.)
  preconditions:
    - day4_block2_wrapper_tools
  command: |
    python3 tests/test_tool_call_e2e.py --output logs/day4_e2e.jsonl
  expected_observable:
    kind: log_pattern
    value: |
      JSONL has 2 linked entries (initial → tool call request, then
      second call → final answer). Tool call args are valid JSON, valid
      against tool schema. Final answer mentions the
      (3,3),(0,5),(5,0),(1,1) numbers from the mock matrix.
  validation:
    - check: 2 linked JSONL entries
      pass_signal: 2 lines in logs/day4_e2e.jsonl with matching
        parent_request_id chain
      fail_signal: 1 line, or unlinked entries
    - check: tool call args valid JSON
      pass_signal: `tool_calls[0].function.arguments` parses as JSON
        and validates against tools/mock_payoffs.schema.json
      fail_signal: parse fails or schema-validate fails
    - check: final answer mentions the four payoff numbers
      pass_signal: final assistant message contains all of "3,3",
        "0,5", "5,0", "1,1" (or numeric equivalents)
      fail_signal: any number missing — Gemma may have guessed instead
        of using the tool result
  on_failure:
    action: escalate_to_human
    human_message: |
      Gemma sometimes guesses instead of calling the tool. Tighten
      system message ("You MUST use the tool"). If still failing, try
      `tool_choice="required"` if the vLLM image supports it. If still
      failing, log the gap as a measured reliability finding (it's a
      Day 1 of tool calling — see the failure, don't paper over it) and
      proceed to robustness micro-test.
  hard_checkpoint: false
  estimated_minutes: 35
  log_to: run_log

- task_id: day4_block2_robustness
  type: agent_executable
  human_only: false
  description: |
    Robustness micro-test. Re-run same prompt 5 times at temp=0.3.
    Count: how many actually invoked the tool? Per program's
    robustness-as-first-class principle: log the rate. If <80%, you have
    a real reliability gap to characterize, not a bug to silently fix.
    (Source 1:50–2:00.)
  preconditions:
    - day4_block2_e2e_test
  command: |
    python3 tests/test_tool_call_robustness.py --n 5 --temperature 0.3 \
      --output logs/day4_robust.jsonl
  expected_observable:
    kind: metric_threshold
    value: |
      Tool invocation rate over 5 trials at T=0.3.
  validation:
    - check: 5 trials recorded
      pass_signal: 5 lines (or 5 chains) in logs/day4_robust.jsonl
      fail_signal: any other count
    - check: tool invocation rate computed and logged
      pass_signal: rate written to metric_log as
        day4_tool_call_invocation_rate
      fail_signal: not written
  on_failure:
    action: escalate_to_human
    human_message: |
      Robustness measurement did not record. The whole point of this
      micro-test is to characterize reliability — re-run and ensure the
      rate lands in metric_log. A low rate is a finding, not a bug to
      silently fix.
  hard_checkpoint: false
  estimated_minutes: 10
  log_to: run_log
  metric_log_key: day4_tool_call_invocation_rate
```

