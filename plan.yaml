  Existing Day-2 JSONL logs (logs/day2.jsonl) fail validation against
  the updated calls.jsonl schema because the retrieval_context addition
  was made non-optional, OR the new events schema accepts malformed
  events.
recovery_path: |
  retrieval_context MUST be optional and nullable; rerun
  jsonschema.Draft202012Validator over logs/day1.jsonl and logs/day2.jsonl
  to confirm zero validation regressions. If the events schema is
  malformed, revert the file and re-derive from
  notes/research/2026-05-19-adversarial-review/5_frozen_plan_change_proposals.md.
prerequisites:
  - day_3
unblocks:
  - day_4
wall_clock_window:
  block_2: "executes alongside or after Day 3 end-of-day; Day 4 not blocked"
  block_3: "human prose review of CLAUDE.md addendum (separable, can defer)"
