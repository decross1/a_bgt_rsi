## Pre-flight (BEFORE day_1)

> The source plan lists pre-flight items with 24–48 hr lead times.
> The agent verifies these at the start of day_1 and refuses to proceed
> with day_1 Block 2 if any are missing.

```yaml
- task_id: preflight_credentials_staged
  type: agent_executable
  human_only: false
  description: |
    Verify presence of required credentials as environment variables or
    in the credentials file referenced by the source plan: Semantic
    Scholar API key, Anthropic API key, HuggingFace token (read scope),
    GitHub PAT, NVIDIA build.nvidia.com API key.
  preconditions: []
  command: |
    test -n "$SEMANTIC_SCHOLAR_API_KEY" && \
    test -n "$ANTHROPIC_API_KEY" && \
    test -n "$HF_TOKEN" && \
    test -n "$GITHUB_TOKEN" && \
    test -n "$NVIDIA_API_KEY"
  expected_observable:
    kind: shell_exit_code
    value: 0
  validation:
    - check: all five credentials present
      pass_signal: shell exit code 0
      fail_signal: shell exit code non-zero; missing variable named in stderr
  on_failure:
    action: escalate_to_human
    human_message: |
      Pre-flight credential check failed. Stage missing credentials per
      source plan "Pre-flight" section, then resume. Semantic Scholar key
      has 24-48 hr application turnaround — apply first if not already.
  hard_checkpoint: true
  estimated_minutes: 2
  log_to: run_log

- task_id: preflight_software_prestaged
  type: agent_executable
  human_only: false
  description: |
    Verify pre-staged software bookmarks and clones. The vLLM image tag
    bookmarked MUST be `vllm/vllm-openai:v0.20.0` — NOT `:gemma4`,
    which is dev and crashes on FP4 GEMM. The OpenShell cluster image
    bookmarked MUST be `ghcr.io/nvidia/openshell/cluster:0.0.13`
    (or current stable). Clones present: NVIDIA/dgx-spark-playbooks,
    karpathy/autoresearch (canonical upstream — NOT matt-langston's
    dual-Spark fork; see DECISIONS.md D-009), google-deepmind/open_spiel,
    SLAMPAI/game_reasoning_arena.
    Weights present: Gemma 4 26B-A4B-NVFP4 (~19 GB on disk — 18.8 GB
    across 2 safetensors shards; the source "~12 GB" was a stale
    pre-release estimate), BGE-M3 (~1–2 GB), and the MTP drafter
    google/gemma-4-26B-A4B-it-assistant (~870 MB BF16).
  preconditions:
    - preflight_credentials_staged
  command: |
    grep -F "vllm/vllm-openai:v0.20.0" infra/bookmarks.txt && \
    grep -F "ghcr.io/nvidia/openshell/cluster:0.0.13" infra/bookmarks.txt && \
    grep -F "hf:google/gemma-4-26B-A4B-it-assistant" infra/bookmarks.txt && \
    test -d clones/dgx-spark-playbooks && \
    test -d clones/autoresearch && \
    test -d clones/open_spiel && \
    test -d clones/game-reasoning-arena && \
    test -d /mnt/models/gemma-4-26b-a4b-nvfp4 && \
    test -d /mnt/models/bge-m3 && \
    test -d /mnt/models/gemma-4-26b-a4b-it-assistant
  expected_observable:
    kind: shell_exit_code
    value: 0
  validation:
    - check: vLLM image tag is the correct cu130 variant
      pass_signal: grep finds the literal string `vllm/vllm-openai:v0.20.0`
      fail_signal: grep finds `:gemma4` without `-cu130`, or no entry at all
    - check: OpenShell cluster image pinned
      pass_signal: grep finds `ghcr.io/nvidia/openshell/cluster:0.0.13`
      fail_signal: grep returns non-zero
    - check: MTP drafter bookmarked
      pass_signal: grep finds `hf:google/gemma-4-26B-A4B-it-assistant`
      fail_signal: grep returns non-zero
    - check: all four repos cloned
      pass_signal: each `test -d` passes
      fail_signal: any directory missing
    - check: weights present
      pass_signal: both `/mnt/models/...` directories exist
      fail_signal: either missing
    - check: MTP drafter present
      pass_signal: `test -d /mnt/models/gemma-4-26b-a4b-it-assistant` passes
      fail_signal: directory missing
  on_failure:
    action: escalate_to_human
    human_message: |
      Pre-flight software staging incomplete. Re-read source plan
      "Pre-flight" section and complete missing items. Do NOT substitute
      `:gemma4` for `:v0.20.0`.
  hard_checkpoint: true
  estimated_minutes: 5
  log_to: run_log

- task_id: preflight_failure_walkthroughs
  type: human_only
  human_only: true
  description: |
    15-min mental rehearsal of each failure mode listed in the source
    plan: NemoClaw gateway start failure → plain Docker fallback;
    vLLM image throws "Failed to run cutlass FP4 gemm" → wrong tag,
    fix and retry; filesystem cache fills memory → cron drop_caches;
    CUDA auto-updates to 13.2 → roll back via Dashboard before any
    inference.
  artifact_expected: written notes (private)
  agent_action: print_reminder_and_wait
  agent_message: |
    Pre-flight: walk through the four documented failure modes before
    starting Day 1. ~15 min each, mental rehearsal only. Mark this
    complete after the rehearsal.
  blocking: true

- task_id: preflight_physical_setup
  type: human_only
  human_only: true
  description: |
    Open desk/shelf placement, 6"+ clearance all sides, ambient temp
    ≤ 30 °C, UPS or surge protector inline, network on switch (not
    USB-C).
  agent_action: print_reminder_and_wait
  blocking: true
