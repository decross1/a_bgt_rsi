### block_2_build (2 hr, agent_executable)

```yaml
- task_id: day2_block2_jsonl_schema
  type: human_assisted
  human_only: false
  description: |
    JSONL schema lock-in. Write the schema on paper first, then commit
    as `schema/calls.jsonl.schema.json`. Required fields: timestamp
    (ISO 8601), request_id (uuid4), model, model_version (image digest),
    temperature, top_p, seed, prompt_messages (full array), completion,
    usage (input/output tokens), latency_ms, host_metadata (CUDA driver,
    vLLM image tag), caller_tag, parent_request_id (null for now;
    chains start Day 4). (Source 0:00–0:30.)
  preconditions: []
  recommended_reading: [day2_block1_reading]   # informational only; does NOT gate execution
  requires_human_understanding: true   # human authors the schema; agent validates
  autonomy_tier: hard_gate
  autonomy_tier_after_unlock: hard_gate   # load-bearing for downstream reproducibility
  target_zone: schemas
  dispatchable: false   # Track A only; the contract is load-bearing
  command: null  # Schema authoring is human; agent validates output.
  expected_observable:
    kind: file_exists
    value: schema/calls.jsonl.schema.json
  validation:
    - check: schema file exists and is valid JSON Schema
      pass_signal: |
        `python3 -c "import jsonschema, json; jsonschema.Draft202012Validator.check_schema(json.load(open('schema/calls.jsonl.schema.json')))"`
        exits 0
      fail_signal: schema fails to load or check_schema raises
    - check: required fields present
      pass_signal: schema's `required` array contains all 14 listed fields
      fail_signal: any required field missing from schema
    - check: jq parses an example line
      pass_signal: `jq -e . tests/example_call.jsonl` exits 0
      fail_signal: jq parse error
  on_failure:
    action: escalate_to_human
    human_message: |
      JSONL schema check failed. Every call is a research observation;
      reproducibility hinges on metadata completeness. Resolve before
      proceeding to wrapper implementation.
  hard_checkpoint: true
  estimated_minutes: 30
  log_to: run_log

- task_id: day2_block2_wrapper_implementation
  type: agent_assisted
  human_only: false
  description: |
    Thin Python wrapper around vLLM's OpenAI-compatible client. Intercept
    request + response, append JSONL. Two modes: append-only (production)
    and in-memory (tests). Sync and async variants (async needed for
    OpenClaw on Day 6). One required helper: `verify_log_integrity(path)`
    reads back, schema-validates each line, returns count of malformed
    lines (target: 0). Code budget ~100 lines. Resist abstraction — this
    is plumbing. (Source 0:30–1:30.)
  preconditions:
    - day2_block2_jsonl_schema
  command: null  # Agent prepares scaffolding; human (or sub-agent with
                 # file-write tools) writes the implementation. Source
                 # plan explicitly scopes code beyond simple validation
                 # out; preserve that constraint.
  expected_observable:
    kind: file_exists
    value: agent_wrapper/wrapper.py with sync, async, and verify_log_integrity functions
  validation:
    - check: wrapper exposes sync interface
      pass_signal: |
        `python3 -c "from agent_wrapper.wrapper import call_sync; print(call_sync)"`
        exits 0
      fail_signal: ImportError or AttributeError
    - check: wrapper exposes async interface
      pass_signal: |
        `python3 -c "from agent_wrapper.wrapper import call_async; print(call_async)"`
        exits 0
      fail_signal: ImportError or AttributeError
    - check: verify_log_integrity exposed
      pass_signal: |
        `python3 -c "from agent_wrapper.wrapper import verify_log_integrity; print(verify_log_integrity)"`
        exits 0
      fail_signal: ImportError or AttributeError
  on_failure:
    action: escalate_to_human
    human_message: |
      Wrapper interface incomplete. Resist over-abstraction; ~100 lines
      is the code budget. Production = append-only; tests = in-memory.
  hard_checkpoint: false
  estimated_minutes: 60
  log_to: run_log

- task_id: day2_block2_50call_sweep
  type: agent_executable
  human_only: false
  description: |
    50-call validation sweep + determinism check. Script: 50 calls,
    varied temperature {0.0, 0.3, 0.7, 1.0}, varied prompt categories
    {arithmetic, factual, opinion, code, refusal}. (Source 1:30–2:00.)
  preconditions:
    - day2_block2_wrapper_implementation
  command: |
    python3 tests/test_50_calls.py --output logs/day2.jsonl && \
    python3 -c "from agent_wrapper.wrapper import verify_log_integrity; n=verify_log_integrity('logs/day2.jsonl'); print(f'malformed={n}'); assert n==0"
  expected_observable:
    kind: metric_threshold
    value: |
      50 schema-valid JSONL lines, 0 malformed; aggregate tok/s ≥ 40;
      identical outputs at T=0 across 3 calls; identical outputs at
      T=1, seed=42, across 3 calls.
  validation:
    - check: 50 schema-valid JSONL lines
      pass_signal: `wc -l logs/day2.jsonl` returns 50
      fail_signal: any other count
    - check: 0 malformed lines
      pass_signal: verify_log_integrity returns 0
      fail_signal: returns > 0
    - check: aggregate tok/s ≥ 40
      pass_signal: aggregate decode tok/s computed from latency_ms and
        usage.completion_tokens across all 50 calls is ≥ 40
      fail_signal: < 40
    - check: T=0 determinism across 3 calls of the same prompt
      pass_signal: 3 identical completions on the designated T=0
        determinism prompt
      fail_signal: any divergence — vLLM is deterministic at T=0; if
        outputs differ, seed/determinism is broken
    - check: T=1 seed=42 determinism across 3 calls of the same prompt
      pass_signal: 3 identical completions on the designated
        T=1, seed=42 prompt — verifies seed is actually plumbed through
      fail_signal: any divergence — seed plumbing is broken
  on_failure:
    action: abort_day
    human_message: |
      Determinism check failed. Do NOT proceed to Day 3 until fixed.
      Check vLLM launch flags for unset seed; check wrapper's seed
      passthrough; check that the test harness sends identical request
      bodies across the 3 trials. Halt the day's progression and resume
      this task once root cause is identified.
  hard_checkpoint: true
  estimated_minutes: 30
  log_to: run_log
  metric_log_key: day2_jsonl_malformed_count
```

