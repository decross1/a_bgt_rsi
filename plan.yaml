# Agent Plan — Week 1 (Days 31–37 of Phase 1)

> **Reading order for the executing agent.** (1) Preamble above. (2) This
> overview. (3) The state-file schema. (4) The day section corresponding to
> `state.current_day`. The agent MUST NOT skip ahead, MUST NOT execute
> Block 1 tasks under any circumstances, and MUST halt at every task tagged
> `human_gate` or `human_only`.

## Operating contract (read once at start)

- **Block 1 is human-only.** The agent prints the reading and problem set,
  records that Block 1 began, and halts until the human marks it complete.
  The agent does not assist, summarize, derive, or solve. This rule does not
  bend.
- **Version pins are verbatim.** Any image tag, weights hash, CUDA version,
  package name, or backend flag from the source plan appears unchanged in
  this file's `command` and `preconditions`. If the agent's environment does
  not match a pinned value, the task fails — it does not "best-effort"
  substitute.
- **Validations are independent.** Each bullet under a source "Validation:"
  line is a separate check with its own `pass_signal` / `fail_signal`. The
  agent reports each independently. Mismatches are never silently coerced
  into passes.
- **Hard checkpoints abort the day.** A failed task with
  `hard_checkpoint: true` causes the agent to write a `day_aborted` event to
  the run log and stop work for that day. The next day's Block 2 is gated on
  the prior day's success unless the source explicitly allows continuation.
- **Day 7 publication is human-gated.** The agent runs the experiment,
  produces the analysis artifacts, and HALTS before any publication step.
- **Logging is mandatory.** Every agent-executable task appends a JSONL line
  to `./run_state/week1.run.jsonl`.
- **Resume is state-file-authoritative.** On startup the agent reads
  `./run_state/week1.state.json` and resumes at the first incomplete task
  in `current_day`.

## State-file schema

The agent reads and writes `./run_state/week1.state.json` with this shape:

```json
{
  "plan_id": "week1_phase1_days_31_37",
  "started_at": "<ISO 8601 timestamp>",
  "current_day": "day_<N>",
  "completed_tasks": ["day1_block1_reading", "..."],
  "aborted_days": [],
  "human_gates_pending": ["day7_publication_review"],
  "fallbacks_taken": {"day1_nemoclaw": "plain_docker"},
  "metric_log": {
    "day1_tokens_per_sec": null,
    "day2_jsonl_malformed_count": null,
    "day3_needle_score": null,
    "day4_tool_call_invocation_rate": null,
    "day5_papers_ingested": null,
    "day6_orchestrator_5_of_5": null,
    "day7_coop_rate_vs_tft": null
  }
}
```

The agent appends to `completed_tasks` only after a task's validation passes
(or, for `human_only` tasks, after the human marks it complete). On a hard
checkpoint failure, the agent appends `current_day` to `aborted_days` and
halts.

## Run-log entry schema

Every agent-executable task appends to
`./run_state/week1.run.jsonl` an object with at minimum:

```json
{
  "timestamp": "<ISO 8601>",
  "day_id": "day_<N>",
  "task_id": "<id>",
  "status": "started | passed | failed | aborted | human_gate_blocked",
  "observable_actual": "<string or structured>",
  "observable_expected": "<string or structured>",
  "duration_ms": 0,
  "fallback_taken": null
}
```

State transitions (day start, day abort, fallback selection, human gate
hit) are logged as their own entries with `task_id` set to the transition
name (e.g. `day3_start`, `day1_aborted`, `day7_publication_gate_hit`).

