### block_2_build (~2.5 hr, agent_executable)

```yaml
- task_id: day3_5_block2_retrieval_context_field
  type: agent_executable
  human_only: false
  description: |
    Extend schema/calls.jsonl.schema.json to allow an OPTIONAL nullable
    retrieval_context field on each call record. Field is a list of
    objects, each {doc_id: string, content_hash: string, chunk_offset:
    integer, chunk_length: integer}. Field is NOT in the required[] array
    so existing Day-1 / Day-2 logs remain valid. Add a test that
    re-validates logs/day1.jsonl and logs/day2.jsonl against the updated
    schema (must pass with zero changes to the existing log files).
  agent_assisted: true
  command: null
  preconditions:
    - schema/calls.jsonl.schema.json exists (Day 2 deliverable)
  validation:
    - check: schema is valid JSON Schema 2020-12
      pass_signal: jsonschema.Draft202012Validator.check_schema() returns
      fail_signal: schema rejected
    - check: existing log files re-validate
      pass_signal: every record in logs/day1.jsonl and logs/day2.jsonl
        passes the updated schema
      fail_signal: any record fails validation
    - check: retrieval_context field is optional and nullable
      pass_signal: field absent from required[]; when present, type
        accepts array or null
      fail_signal: field required, or only allows one of array/null
  on_failure: revert schema; do not advance to next task
  log_to: run_log
  rationale: |
    Reproducibility commitment in PROJECT_CONTEXT.md §3 — "every model
    call is a research observation" — is not load-bearing unless the
    retrieved literature that conditioned the prompt is pinned in the
    log. Retrieval drifts as the corpus grows. See D-025 and missed
    gap M1 in the adversarial review memo.

- task_id: day3_5_block2_events_schema
  type: agent_executable
  human_only: false
  description: |
    Create schema/events.jsonl.schema.json as a sibling to calls.jsonl
    that validates two typed event records. Schema is a root oneOf with
    two members:

      1. human_intervention event: required fields {event_type ==
         "human_intervention", timestamp, task_id, subtype, reason,
         context_hash}. subtype enum: edit_prompt | edit_code | reject |
         redirect | manual_decision.

      2. calibration_entry event: required fields {event_type ==
         "calibration_entry", timestamp, experiment_id, metric_name,
         pre_experiment_expected_range, post_experiment_observed,
         within_range, human_attestation}.

    Both members are additionalProperties:false. Add tests that
    exercise each event-type happy path and at least two malformed
    cases per type.
  agent_assisted: true
  command: null
  preconditions:
    - day3_5_block2_retrieval_context_field
  validation:
    - check: schema is valid JSON Schema 2020-12
      pass_signal: jsonschema.Draft202012Validator.check_schema() returns
      fail_signal: schema rejected
    - check: happy-path event of each type validates
      pass_signal: both example records pass
      fail_signal: either fails
    - check: event_type discriminator routes correctly
      pass_signal: a human_intervention payload with calibration_entry's
        required fields fails validation, and vice versa
      fail_signal: cross-type confusion not caught
  on_failure: revert schema; do not advance to next task
  log_to: run_log
  rationale: |
    P1 (human_intervention) and P3 (calibration_entry) from the
    adversarial review's frozen-plan change proposals. P1 supports
    preprint defensibility (count of human edits inside agent tasks);
    P3 turns the Day-7 hard-checkpoint's pre/post expected-range
    comparison into a publishable calibration metric over time. See
    D-025.

- task_id: day3_5_block2_wrapper_retrieval_passthrough
  type: agent_executable
  human_only: false
  description: |
    Update agent_wrapper/ so that every wrapper.py call accepts an
    optional retrieval_context kwarg (list[{doc_id, content_hash,
    chunk_offset, chunk_length}] or None) and writes it to the call
    record. Default null. Update agent_wrapper/ tests to cover the
    null-default and a populated-list case. The wrapper change must
    preserve the Day-2 success-criterion: the 50-call sweep still
    produces zero malformed records under the updated schema. No
    behavioral change for callers that do not pass retrieval_context.
  agent_assisted: true
  command: null
  preconditions:
    - day3_5_block2_retrieval_context_field
    - day3_5_block2_events_schema
  validation:
    - check: wrapper accepts and forwards retrieval_context
      pass_signal: unit test confirms the field is present in the
        written record when supplied, and absent (or null) when not
      fail_signal: field missing or wrapper raises on the new kwarg
    - check: Day-2 50-call sweep regression
      pass_signal: a re-run of the 50-call sweep (or equivalent
        regression fixture) emits zero malformed records under the
        updated schema
      fail_signal: any malformed record
    - check: no changes to existing wrapper signatures break callers
      pass_signal: existing test suite passes unchanged
      fail_signal: any existing test fails
  on_failure: revert wrapper change; do not advance to Day 4
  log_to: run_log
  rationale: |
    P2 from the adversarial review's frozen-plan change proposals. The
    schema work alone is inert unless the wrapper actually populates
    the field; the wrapper change is the load-bearing implementation.
```

