### block_2_build (2 hr, agent_executable, with router)

```yaml
- task_id: day5_block2_ml_intern_router
  type: agent_executable
  human_only: false
  description: |
    Decision point: ML-Intern path or fallback path? ML-Intern is more
    complete (literature workflow templates, doom-loop detection) but
    ARM64-untested per validation pass. Fallback is direct Semantic
    Scholar API + Python — definitely works. Try ML-Intern for 45 min;
    if not running by 0:45, fall back.
  preconditions:
    - preflight_credentials_staged
  recommended_reading: [day5_block1_reading]   # informational only; does NOT gate execution
  autonomy_tier: hard_gate
  autonomy_tier_after_unlock: soft_gate
  target_zone: pipeline
  dispatchable: true
  command: |
    # Probe: can ML-Intern even install on this ARM64 host?
    test -d clones/ml-intern || git clone <url> clones/ml-intern && \
    cd clones/ml-intern && python3 -m pip install -r requirements.txt --dry-run
  branches:
    on_success: day5_block2_ml_intern_attempt
    on_failure: day5_block2_pipeline_fallback
    timeout_minutes: 45
    on_timeout: day5_block2_pipeline_fallback
  log_to: run_log

- task_id: day5_block2_ml_intern_attempt
  type: agent_assisted
  human_only: false
  description: |
    ML-Intern attempt. Clone, install per README, set env vars
    (`ANTHROPIC_API_KEY`, `HF_TOKEN`, `GITHUB_TOKEN`,
    `LOCAL_LLM_BASE_URL=http://localhost:8000/v1`), run hello-world.
    Validate one literature query returns ≥3 papers.
    (Source 0:00–0:45 with hard 45-min cap.)
  preconditions:
    - day5_block2_ml_intern_router
  command: |
    cd clones/ml-intern && \
    pip install -r requirements.txt && \
    ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
    HF_TOKEN="$HF_TOKEN" \
    GITHUB_TOKEN="$GITHUB_TOKEN" \
    LOCAL_LLM_BASE_URL="http://localhost:8000/v1" \
    python3 examples/hello_world.py && \
    python3 examples/literature_query.py --topic "LLM agents repeated games" --output /tmp/ml_intern_test.json
  expected_observable:
    kind: metric_threshold
    value: |
      Hello-world succeeds; one literature query returns ≥3 papers.
  validation:
    - check: hello-world exits 0
      pass_signal: shell exit 0
      fail_signal: any non-zero
    - check: literature query returns ≥3 papers
      pass_signal: parsed JSON has ≥3 entries
      fail_signal: < 3
  on_failure:
    action: use_fallback
    fallback_task_id: day5_block2_pipeline_fallback
    human_message: |
      ML-Intern install failed within 45-min cap. Falling back to
      direct Semantic Scholar API path. Do not lose Day 5 to ML-Intern
      install.
  hard_checkpoint: false
  estimated_minutes: 45
  log_to: run_log
  state_update_on_failure: fallbacks_taken.day5_ml_intern = "direct_api"

- task_id: day5_block2_pipeline_fallback
  type: agent_assisted
  human_only: false
  description: |
    Direct Semantic Scholar API path. Skip ML-Intern; continue with
    direct API + Python. Used either if ML-Intern attempt fails or if
    the router timed out.
  preconditions:
    - day5_block2_ml_intern_router
  command: null  # Implementation in pipeline/arxiv_scraper.py is
                 # authored; the pipeline-implementation task below
                 # runs and validates it.
  expected_observable:
    kind: file_exists
    value: pipeline/arxiv_scraper.py and pipeline/embed_and_store.py
  validation:
    - check: scripts present
      pass_signal: both files exist
      fail_signal: either missing
  hard_checkpoint: false
  estimated_minutes: 10
  log_to: run_log
  state_update: fallbacks_taken.day5_ml_intern = "direct_api"

- task_id: day5_block2_pipeline_implementation
  type: agent_executable
  human_only: false
  description: |
    Pipeline implementation. Source: Semantic Scholar API. With key:
    1 RPS dedicated; without: 5000/5min shared pool. Exponential
    backoff is required by current policy. Filters: arXiv categories
    `cs.MA`, `cs.GT`, `econ.TH`. Date range: last 7 days for Day 5
    first run; last 24 hrs for daily cron. For each paper: title,
    abstract, authors, arxiv_id, semantic_scholar_id, citation_count.
    Embed abstract (not full paper) with BGE-M3. Insert into
    `papers_recent` collection; deduplicate on arxiv_id.
    (Source 0:45–1:30.)
  preconditions:
    - day5_block2_pipeline_fallback OR day5_block2_ml_intern_attempt
  command: |
    python3 pipeline/arxiv_scraper.py \
      --categories cs.MA,cs.GT,econ.TH \
      --since-days 7 \
      --output /tmp/papers_day5.jsonl && \
    python3 pipeline/embed_and_store.py \
      --input /tmp/papers_day5.jsonl \
      --collection papers_recent \
      --bge-m3-weights /mnt/models/bge-m3
  expected_observable:
    kind: metric_threshold
    value: |
      First run ≥30 papers across the three categories
      (target ≥50 per success criterion); manual cross-check 2 papers
      on arxiv.org by ID.
  validation:
    - check: ≥30 papers ingested
      pass_signal: papers_recent collection count delta ≥ 30
      fail_signal: < 30
    - check: ≥50 papers ingested (success criterion target)
      pass_signal: count delta ≥ 50 — record to metric_log
      fail_signal: 30 ≤ count < 50 → continue but record as below target
    - check: 2 random papers cross-checked manually
      pass_signal: human attests 2 picked papers exist on arxiv.org
      fail_signal: human flags hallucinated arxiv_id
    - check: BGE-M3 used for embeddings
      pass_signal: collection metadata embedding_function == "BGE-M3"
      fail_signal: any other value
    - check: dedup on arxiv_id
      pass_signal: no duplicate arxiv_id in collection
      fail_signal: duplicates present
  on_failure:
    action: escalate_to_human
    human_message: |
      Pipeline ingest count below 30 OR cross-check failed. Common
      causes: rate-limited (no exponential backoff), wrong category
      filters, embedding model not BGE-M3.
  hard_checkpoint: false
  estimated_minutes: 45
  log_to: run_log
  metric_log_key: day5_papers_ingested

- task_id: day5_block2_retrieval_test
  type: agent_executable
  human_only: false
  description: |
    Retrieval test. Query: "LLM agents in repeated games." Expected:
    top-3 includes ≥1 paper with relevant abstract. Sanity check that
    the literature layer will be useful for Day 7's experiment context.
    Log query latency (target sub-second). (Source 1:30–2:00.)
  preconditions:
    - day5_block2_pipeline_implementation
  command: |
    python3 tests/test_papers_retrieval.py \
      --query "LLM agents in repeated games" \
      --top-k 3 \
      --output bench/day5_retrieval.json
  expected_observable:
    kind: metric_threshold
    value: |
      Top-3 includes ≥1 paper whose abstract is genuinely relevant
      (human review); query latency sub-second.
  validation:
    - check: latency sub-second
      pass_signal: query latency_ms < 1000
      fail_signal: ≥ 1000
    - check: ≥1 relevant paper in top-3
      pass_signal: human attests at least 1 of top-3 is relevant
      fail_signal: human says all 3 are off-topic
  on_failure:
    action: escalate_to_human
    human_message: |
      Retrieval test failed. The literature layer is meant to feed
      Day 7's experiment context. Investigate before Day 6.
  hard_checkpoint: false
  estimated_minutes: 15
  log_to: run_log
```

