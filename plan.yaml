### block_2_build (2 hr, agent_executable, with explicit human_gate at end)

```yaml
- task_id: day7_block2_openspiel_up
  type: agent_executable
  human_only: false
  description: |
    OpenSpiel + Game Reasoning Arena up. Per validation pass adjustment
    3: use OpenSpiel + GRA, not a custom game env. Saves 1–2 weeks.
    (Source 0:00–0:20.)
  preconditions:
    - preflight_software_prestaged
  recommended_reading: [day7_block1_reading]   # informational only; does NOT gate execution
  autonomy_tier: hard_gate
  autonomy_tier_after_unlock: soft_gate
  target_zone: experiments
  dispatchable: false   # Track A runs Day-7 experiment on the live GPU
  command: |
    python3 -c "import pyspiel; game = pyspiel.load_game('matrix_pd'); print(game)" && \
    python3 tests/test_gra_random_vs_random.py \
      --game matrix_pd --episodes 5 --output bench/day7_random.json
  expected_observable:
    kind: metric_threshold
    value: |
      pyspiel loads matrix_pd; GRA random-vs-random yields ~50%
      cooperation rate over 5 episodes.
  validation:
    - check: pyspiel imports and loads matrix_pd
      pass_signal: shell exit 0 and game object printed
      fail_signal: ImportError or load_game error
    - check: random vs. random yields ~50% cooperation
      pass_signal: cooperation rate in [0.3, 0.7] over 5 episodes
        (sanity band — exact 0.5 is unlikely with 5 episodes)
      fail_signal: rate outside [0.3, 0.7] — env or agent registry
        broken
  on_failure:
    action: escalate_to_human
    human_message: |
      OpenSpiel or GRA not functional. The whole experiment depends
      on this; investigate before continuing Block 2.
  hard_checkpoint: true
  estimated_minutes: 20
  log_to: run_log

- task_id: day7_block2_strategies_and_llm_agent
  type: agent_assisted
  human_only: false
  description: |
    Fixed strategies + LLM agent. TFT, grim trigger, all-C, all-D as
    GRA agents (~10 lines each). LLM agent: takes history (list of
    `(own_action, opp_action)` tuples), prompts Gemma 4 with rules +
    history + asks for next move, parses output.

    CRITICAL: the LLM agent's prompt must NOT include the words
    "tit-for-tat" or any strategy names. That contaminates the
    experiment. Provide rules and history only.

    Parser: retry once on malformed output, then play D as default
    (and log the parse failure as a tracked observation, not a silent
    fix). (Source 0:20–0:50.)
  preconditions:
    - day7_block2_openspiel_up
  command: |
    # Dry-run: 1 episode of LLM vs. all-D, 10 rounds.
    python3 experiments/exp001_repeated_pd/dry_run_llm_vs_all_d.py \
      --rounds 10 --output bench/day7_dryrun.json
  expected_observable:
    kind: log_pattern
    value: |
      LLM should switch to D within a few rounds.
  validation:
    - check: LLM agent prompt does NOT contain forbidden strings
      pass_signal: |
        `grep -E "tit-for-tat|tit for tat|grim trigger|all-C|all-D" experiments/exp001_repeated_pd/llm_agent.py`
        returns no matches in user-facing prompt strings
      fail_signal: any match — contaminated experiment, do not run
    - check: parser retry-once + log-as-observation policy
      pass_signal: parser code logs malformed-output events to JSONL
        with a distinct status before defaulting to D; no silent fix
      fail_signal: silent default without log entry
    - check: dry-run shows LLM switches to D within first ~5 rounds
      pass_signal: in 10-round dry-run, LLM action is D for the
        majority of the last 5 rounds when facing all-D
      fail_signal: LLM stays cooperating against all-D — reasoning is
        not tracking opponent
  on_failure:
    action: escalate_to_human
    human_message: |
      Either the prompt is contaminated with strategy names (do not
      run) or the LLM is not tracking its opponent in the dry-run
      (parser broken or model misconfigured). Fix before the
      500-round run.
  hard_checkpoint: true
  estimated_minutes: 30
  log_to: run_log

- task_id: day7_block2_precompute_expected_range
  type: human_only
  human_only: true
  description: |
    Sanity-check safeguard (per validation pass). Pre-compute expected
    cooperation rate range for LLM vs. TFT BEFORE the run, write it
    down. Source plan's stated range: roughly 60–95% over 100 rounds.
    After the run, check actual against this. If outside the range,
    do not declare success — investigate. Safeguards against silent
    model misconfiguration (e.g., wrong MoE backend producing nonsense
    outputs that parse but don't reason).
  agent_action: print_reminder_and_wait
  agent_message: |
    Before starting the 500-round experiment: write your expected
    cooperation-rate range for LLM vs. TFT on paper. Source's published
    range is roughly 60–95% over 100 rounds. Mark this complete after
    you have written it down. The agent will compare actual to your
    range after the run.
  blocking: true

- task_id: day7_block2_run_experiment
  type: agent_executable
  human_only: false
  description: |
    Run the experiment. 100 rounds × 5 opponents (TFT, grim trigger,
    all-C, all-D, mirror-LLM) = 500 rounds total. Each round: full
    prompt + completion logged via wrapper to JSONL. Each opponent:
    cooperation rate, payoff trajectory, switch points logged. Run
    sequentially through Day 6's orchestrator (its first real use).
    Expected runtime: ~20–40 min depending on tok/s and prompt length.
    (Source 0:50–1:30.)
  preconditions:
    - day7_block2_strategies_and_llm_agent
    - day7_block2_precompute_expected_range
  command: |
    python3 experiments/exp001_repeated_pd/run.py \
      --opponents tft,grim_trigger,all_c,all_d,mirror_llm \
      --rounds 100 \
      --output-dir experiments/exp001_repeated_pd/results/ \
      --jsonl-log logs/exp001.jsonl \
      --via-orchestrator
  expected_observable:
    kind: metric_threshold
    value: |
      500 rounds completed; per-opponent cooperation rate, mean payoff,
      switch points logged.
  validation:
    - check: 500 rounds completed
      pass_signal: results/cooperation_rates.csv has 5 rows × 100
        round columns OR equivalent structure with 500 round records
      fail_signal: missing rounds
    - check: LLM-vs-TFT cooperation rate inside human's pre-computed
      range
      pass_signal: actual rate within the range written in
        notes/day7_expected_range.md
      fail_signal: rate OUTSIDE the human's pre-written range — do
        NOT declare success; investigate (this is the silent-model-
        misconfiguration safeguard)
    - check: parse failures logged as observations, not silent fixes
      pass_signal: parse_failure events visible in logs/exp001.jsonl
      fail_signal: no parse_failure events AND non-zero default-D
        plays
  on_failure:
    action: escalate_to_human
    human_message: |
      Experiment did not complete cleanly OR LLM cooperation rate
      against TFT is outside your pre-computed range. Both are
      blocking issues. Investigate the silent-failure-mode question
      first: is the MoE backend still MARLIN? Re-run vLLM startup-log
      check from day1_block2_vllm_serve. Then look at parse failures
      and prompt drift.
  hard_checkpoint: true
  estimated_minutes: 40
  log_to: run_log
  metric_log_key: day7_coop_rate_vs_tft

- task_id: day7_block2_quicklook
  type: agent_executable
  human_only: false
  description: |
    Quick-look analysis. Per-opponent cooperation rate, mean payoff,
    plot of cumulative payoff over rounds. Compare LLM to "rational"
    benchmark (TFT vs. TFT cooperates fully; all-C vs. all-D loses
    every round). Eyeball: does the LLM track the opponent, or is it
    constant? (Source 1:30–2:00.)
  preconditions:
    - day7_block2_run_experiment
  command: |
    python3 experiments/exp001_repeated_pd/quicklook.py \
      --input experiments/exp001_repeated_pd/results/ \
      --output-dir experiments/exp001_repeated_pd/plots/ \
      --analysis-md experiments/exp001_repeated_pd/analysis/quicklook.md
  expected_observable:
    kind: file_exists
    value: |
      experiments/exp001_repeated_pd/plots/* (cumulative payoff plots)
      and analysis/quicklook.md (per-opponent summary).
  validation:
    - check: 5 cumulative-payoff plots produced
      pass_signal: 5 plot files in experiments/exp001_repeated_pd/plots/
      fail_signal: any other count
    - check: per-opponent cooperation rate + mean payoff in
      quicklook.md
      pass_signal: 5 opponents × 2 metrics tabulated
      fail_signal: incomplete
  on_failure:
    action: escalate_to_human
    human_message: |
      Quicklook analysis incomplete. The data exists in logs and
      results/; re-run the analysis script.
  hard_checkpoint: false
  estimated_minutes: 30
  log_to: run_log

- task_id: day7_publication_review_gate
  type: human_only
  human_only: true
  description: |
    GRADUATED-AUTONOMY GATE. Per source: "DO NOT publish today. Per
    graduated-autonomy principle: human (you) reviews before
    publication. Tomorrow's Block 3 or a follow-up day is the right
    time for the public results post. Today's journal post is the
    retrospective, not the result announcement."

    The agent MUST NOT auto-publish results. The agent halts here,
    prints the gate notice, and writes a `human_gates_pending` entry.
  agent_action: halt_and_print_message
  agent_message: |
    HUMAN REVIEW GATE — DAY 7 EXPERIMENT RESULTS

    The experiment is complete. The agent will NOT publish results
    today. Per the graduated-autonomy architecture for Phase 1:

      • Today's public post is the WEEKLY RETROSPECTIVE, not the
        results announcement.
      • Results publication happens on a follow-up day, after you
        review:
          - logs/exp001.jsonl integrity
          - cooperation rates against your pre-computed expected range
          - parse-failure events
          - whether the LLM tracked opponents in the per-round logs

    The agent has updated state.human_gates_pending with
    "day7_publication_review". Resume publication only after you
    explicitly mark this gate complete.
  blocking: true
  state_update: human_gates_pending += "day7_publication_review"
```

