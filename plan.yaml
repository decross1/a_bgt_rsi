### block_2_build (2 hr, agent_executable, with branching)

```yaml
- task_id: day6_block2_worker_contract
  type: human_assisted
  human_only: false
  description: |
    Define the interface: input = `{task_id, task_type, payload,
    parent_request_id}`; output = `{task_id, status, result, errors,
    jsonl_log_path}`. Every architectural promise about "agents" hinges
    on a clean worker contract. Get it wrong now, pay for it forever.
    Commit `schema/worker_contract.schema.json`. (Source 0:00–0:20.)
  preconditions: []
  recommended_reading: [day6_block1_reading]   # informational only; does NOT gate execution
  requires_human_understanding: true   # human authors the worker contract; agent validates
  autonomy_tier: hard_gate
  autonomy_tier_after_unlock: hard_gate   # load-bearing for downstream architecture
  target_zone: schemas
  dispatchable: false
  command: null  # Schema authoring is human; agent validates.
  expected_observable:
    kind: file_exists
    value: schema/worker_contract.schema.json
  validation:
    - check: schema is valid JSON Schema
      pass_signal: |
        `python3 -c "import jsonschema, json; jsonschema.Draft202012Validator.check_schema(json.load(open('schema/worker_contract.schema.json')))"`
        exits 0
      fail_signal: schema fails validation
    - check: input fields exactly task_id, task_type, payload,
        parent_request_id
      pass_signal: input schema's required array == those four
      fail_signal: extra or missing fields
    - check: output fields exactly task_id, status, result, errors,
        jsonl_log_path
      pass_signal: output schema's required array == those five
      fail_signal: extra or missing fields
  on_failure:
    action: escalate_to_human
    human_message: |
      Worker contract incomplete or misshaped. The contract is load-
      bearing for everything downstream; do not paper over it.
  hard_checkpoint: true
  estimated_minutes: 20
  log_to: run_log

- task_id: day6_block2_orchestrator_router
  type: agent_executable
  human_only: false
  description: |
    Decide whether OpenClaw can use the NemoClaw sandbox or must use
    the plain-Docker / multiprocessing fallback. Reads
    state.fallbacks_taken.day1_nemoclaw to seed the decision; probes
    NemoClaw if not yet decided.
  preconditions:
    - day6_block2_worker_contract
    - preflight_software_prestaged
  command: |
    nemoclaw status 2>/dev/null | grep -q healthy || echo "fallback"
  branches:
    on_success: day6_block2_orchestrator_with_nemoclaw
    on_failure: day6_block2_orchestrator_with_fallback
    timeout_minutes: 10
    on_timeout: day6_block2_orchestrator_with_fallback
  log_to: run_log

- task_id: day6_block2_orchestrator_with_nemoclaw
  type: agent_assisted
  human_only: false
  description: |
    OpenClaw orchestrator using NemoClaw sandbox for worker isolation.
    Install OpenClaw per its README; pin version. One task type:
    `summarize_paper(arxiv_id)` — retrieves abstract from
    `papers_recent`, asks Gemma 4 to summarize in 100 words, returns
    summary. Orchestrator: receives task, spawns worker (NemoClaw
    container), waits with 60 s timeout, logs both sides.
    (Source 0:20–1:00.)
  preconditions:
    - day6_block2_orchestrator_router
  command: null
  expected_observable:
    kind: log_pattern
    value: |
      One worker, one task end-to-end; JSONL has 3 linked entries
      (orchestrator dispatch → worker invocation → orchestrator
      receipt).
  validation:
    - check: 3 linked JSONL entries
      pass_signal: logs/orchestrator.jsonl contains 3 entries with
        matching parent_request_id chain for the test task
      fail_signal: any other count
    - check: 60 s timeout enforced
      pass_signal: orchestrator code path includes a 60-s timeout
      fail_signal: no timeout or different value
  on_failure:
    action: use_fallback
    fallback_task_id: day6_block2_orchestrator_with_fallback
    human_message: |
      OpenClaw + NemoClaw integration failed. Per source: this is the
      most-untested combination. Falling back to Python multiprocessing
      for orchestration today; isolation gets re-added in Week 2.
  hard_checkpoint: false
  estimated_minutes: 40
  log_to: run_log

- task_id: day6_block2_orchestrator_with_fallback
  type: agent_assisted
  human_only: false
  description: |
    OpenClaw orchestrator using Python `multiprocessing` for worker
    spawn — no isolation, but functional. Used either when
    OpenClaw+NemoClaw integration fails or when the router selected
    fallback. Same task type, same logging, same timeout discipline.
  preconditions:
    - day6_block2_orchestrator_router
  command: null
  expected_observable:
    kind: log_pattern
    value: |
      One worker, one task end-to-end; JSONL has 3 linked entries.
  validation:
    - check: 3 linked JSONL entries
      pass_signal: same as primary path
      fail_signal: same as primary path
  on_failure:
    action: escalate_to_human
    human_message: |
      Even the fallback orchestrator failed. Stop and inspect; this is
      a Day 6 hard problem because Day 7 needs the orchestrator.
  hard_checkpoint: false
  estimated_minutes: 40
  log_to: run_log
  state_update: fallbacks_taken.day6_orchestrator_isolation = "multiprocessing"

- task_id: day6_block2_robustness_mini
  type: agent_executable
  human_only: false
  description: |
    Robustness mini-suite. Spawn 5 workers sequentially (concurrency is
    a Week 2 problem). All 5 must succeed; log timing. Spawn 1 worker
    with deliberately malformed input; orchestrator must reject cleanly
    without crashing. (Source 1:00–1:30.)
  preconditions:
    - day6_block2_orchestrator_with_nemoclaw OR
      day6_block2_orchestrator_with_fallback
  command: |
    python3 tests/test_orchestrator_5_sequential.py \
      --output logs/day6_5seq.jsonl && \
    python3 tests/test_orchestrator_malformed_input.py \
      --output logs/day6_malformed.jsonl
  expected_observable:
    kind: metric_threshold
    value: |
      5/5 success on valid input; clean rejection on invalid; no
      orphan processes (`ps aux | grep worker`).
  validation:
    - check: 5/5 sequential success
      pass_signal: 5 worker tasks all status=passed
      fail_signal: any status != passed
    - check: clean rejection on malformed input
      pass_signal: orchestrator returned a structured error response;
        worker did not crash; orchestrator did not crash
      fail_signal: stack trace, hang, or accepted bad input
    - check: no orphan worker processes after run
      pass_signal: `ps aux | grep -c worker` excluding grep itself == 0
      fail_signal: any leftover worker process
  on_failure:
    action: escalate_to_human
    human_message: |
      Robustness mini-suite failed. Either the success path is flaky
      or input validation is broken. Day 7 cannot run on a flaky
      orchestrator.
  hard_checkpoint: true
  estimated_minutes: 30
  log_to: run_log
  metric_log_key: day6_orchestrator_5_of_5

- task_id: day6_block2_inspect_run_cli
  type: agent_assisted
  human_only: false
  description: |
    `tools/inspect_run.py` CLI. Each successful task writes to
    `logs/orchestrator.jsonl`. Add a CLI: input = `task_id`, output =
    full causal chain (orchestrator → worker → wrapper → vLLM call).
    This is the "reproducibility" promise made operational.
    (Source 1:30–2:00.)
  preconditions:
    - day6_block2_robustness_mini
  command: |
    python3 tools/inspect_run.py --task-id "$(jq -r '.task_id' logs/day6_5seq.jsonl | head -1)"
  expected_observable:
    kind: log_pattern
    value: |
      Full chain prints: orchestrator dispatch line, worker invocation
      line, wrapper request/response line, vLLM call line.
  validation:
    - check: pick a task_id, run CLI, full chain prints
      pass_signal: stdout contains all four levels with matching IDs
      fail_signal: missing any level or chain broken
  on_failure:
    action: escalate_to_human
