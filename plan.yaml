### block_2_build (2 hr, agent_executable)

```yaml
- task_id: day1_block2_unbox
  type: human_assisted
  human_only: false
  description: |
    Unbox + place + power. Open desk/shelf, 6"+ clearance, ambient
    ≤ 30 °C, UPS inline. (Source 0:00–0:20.) Physical placement is
    human; the agent verifies dashboard reachability post-placement.
  preconditions:
    - preflight_physical_setup
  recommended_reading: [day1_block1_reading]   # informational only; does NOT gate execution
  autonomy_tier: hard_gate
  autonomy_tier_after_unlock: hard_gate   # physical UI work, can't automate
  target_zone: orchestrator
  dispatchable: false
  command: |
    # Human action: unbox and place. Agent verifies after.
    ping -c 3 "${DGX_SPARK_LAN_IP}" && \
    curl -fsS "http://${DGX_SPARK_LAN_IP}/" >/dev/null
  expected_observable:
    kind: log_pattern
    value: |
      power LED solid; fan at low RPM audible; DGX Dashboard reachable
      on local IP.
  validation:
    - check: power LED solid
      pass_signal: human confirms via print_reminder_and_wait sub-prompt
      fail_signal: human reports LED off / blinking
    - check: fan at low RPM audible
      pass_signal: human confirms
      fail_signal: human reports no fan or high RPM
    - check: DGX Dashboard reachable on local IP
      pass_signal: curl returns 2xx OR ping succeeds
      fail_signal: curl returns connection refused / timeout
  on_failure:
    action: escalate_to_human
    human_message: |
      Dashboard unreachable. From another LAN host, run:
        arp -a | grep -i nvidia
      Identify the Spark's MAC and IP, set DGX_SPARK_LAN_IP, re-run.
  hard_checkpoint: false
  estimated_minutes: 20
  log_to: run_log

- task_id: day1_block2_firmware
  type: agent_assisted
  human_only: false
  description: |
    Firmware baseline + auto-update lock. Apply ALL pending firmware
    (Jan 2026 thermal, Feb 2026 ConnectX-7 idle, April 2026 release).
    Settings → Updates → Manual approval only. Pin CUDA 13.0; 13.2
    produces gibberish on multiple models. (Source 0:20–0:50.)
    Agent prepares the verification command; human applies firmware
    and toggles the manual-approval setting via the Dashboard UI.
  preconditions:
    - day1_block2_unbox
  command: |
    # Run AFTER human applies firmware updates and locks auto-update.
    nvidia-smi | head -3
  expected_observable:
    kind: log_pattern
    value: |
      Output shows GB10, CUDA 13.0, ~25W idle.
  validation:
    - check: GPU is GB10
      pass_signal: nvidia-smi output contains "GB10"
      fail_signal: GB10 not found in output
    - check: CUDA version is exactly 13.0
      pass_signal: nvidia-smi output contains "CUDA Version: 13.0"
      fail_signal: output contains "13.2" or any other version
    - check: idle power ~25W
      pass_signal: power draw value parses to a number ≤ 35 W under no load
      fail_signal: power draw > 35 W with no inference running
  on_failure:
    action: escalate_to_human
    human_message: |
      If CUDA reads 13.2, ROLL BACK via Dashboard before any inference.
      The 13.2 release produces gibberish output on low-bit quantized
      models. After rollback, re-verify with nvidia-smi | head -3.
  hard_checkpoint: true
  estimated_minutes: 30
  log_to: run_log

- task_id: day1_block2_docker_config
  type: agent_executable
  human_only: false
  description: |
    Cache cron + Docker daemon config. Root crontab entry to clear
    filesystem cache every 30 min (prevents documented slowdown to
    ~16 tok/s). `/etc/docker/daemon.json` adds `"cgroupns": "host"`
    (community NemoClaw fix); restart docker. (Source 0:50–1:10.)
  preconditions:
    - day1_block2_firmware
  command: |
    sudo bash -c 'crontab -l 2>/dev/null | { cat; echo "*/30 * * * * sync && echo 3 | tee /proc/sys/vm/drop_caches > /dev/null"; } | crontab -' && \
    sudo python3 -c 'import json,pathlib; p=pathlib.Path("/etc/docker/daemon.json"); d=json.loads(p.read_text()) if p.exists() else {}; d["cgroupns"]="host"; p.write_text(json.dumps(d, indent=2))' && \
    sudo systemctl restart docker
  expected_observable:
    kind: log_pattern
    value: |
      `docker info | grep -i cgroup` shows `host`;
      `crontab -l -u root` shows the drop_caches entry.
  validation:
    - check: docker cgroup namespace is host
      pass_signal: `docker info | grep -i cgroup` output contains `host`
      fail_signal: output does not contain `host` or grep returns no lines
    - check: root crontab contains drop_caches entry
      pass_signal: `sudo crontab -l -u root` contains "drop_caches"
      fail_signal: entry missing
  on_failure:
    action: retry_once
    human_message: |
      Docker daemon config or cron entry failed to apply. Re-run the
      task. If it fails again, inspect /etc/docker/daemon.json and root
      crontab manually before proceeding to vllm_serve.
  hard_checkpoint: false
  estimated_minutes: 20
  log_to: run_log

- task_id: day1_block2_vllm_serve
  type: agent_executable
  human_only: false
  description: |
    vLLM Gemma 4 26B MoE up. Pull `vllm/vllm-openai:v0.20.0`
    (NOT `:gemma4` — that's dev and crashes on FP4 GEMM). Launch with
    `--moe-backend marlin` and NVFP4 weights pre-staged at
    `/mnt/models/gemma-4-26b-a4b-nvfp4`. (Source 1:10–1:50.)
    NOTE: MTP speculative decoding is DEFERRED to Week 2+ — the pinned
    image predates merged vLLM PR #41745 and cannot run it (see
    DECISIONS.md D-019). The drafter and `infra/vllm_patches/gemma4_mtp.py`
    remain staged for then.
  preconditions:
    - day1_block2_docker_config
    - preflight_software_prestaged
  command: |
    docker pull vllm/vllm-openai:v0.20.0 && \
    docker run -d --name vllm-gemma4 --gpus all \
      -v /mnt/models/gemma-4-26b-a4b-nvfp4:/models/gemma-4-26b-a4b-nvfp4:ro \
      -p 8000:8000 \
      vllm/vllm-openai:v0.20.0 \
      --model /models/gemma-4-26b-a4b-nvfp4 \
      --served-model-name gemma-4-26b-a4b \
      --moe-backend marlin \
      --max-num-batched-tokens 8192 && \
    sleep 60 && \
    docker logs vllm-gemma4 2>&1 | tee /tmp/vllm_startup.log
  expected_observable:
    kind: startup_log_match
    value: |
      Two required strings in startup log:
      (1) `Using 'MARLIN' NvFp4 MoE backend`  ← if this says
          `CUTLASS_FP4` instead, STOP — the flag did not pick up.
      (2) `Using default MoE config. Performance might be sub-optimal!`
          is acceptable but means ~24% slower than tuned baseline; log
          and continue.
      (No FLASHINFER/CUTLASS NVFP4-GEMM line is expected: GB10 (SM12x)
      has no native FP4, so vLLM correctly uses the Marlin weight-only
      FP4 path. Corrected 2026-05-18 — see run log 05:50 entry.)
  validation:
    - check: image tag is `:v0.20.0` (NOT plain :gemma4)
      pass_signal: docker pull command used `:v0.20.0` literally
      fail_signal: pull command used `:gemma4` or any other tag
    - check: MoE backend is MARLIN, not CUTLASS_FP4
      pass_signal: log contains "Using 'MARLIN' NvFp4 MoE backend"
      fail_signal: log contains "Using 'CUTLASS_FP4' NvFp4 MoE backend" — this is the silent failure mode; the --moe-backend marlin flag did not take effect
    - check: default-MoE-config warning recorded if present
      pass_signal: presence of "Using default MoE config" string written into metric_log as a non-fatal note
      fail_signal: n/a — informational
    - check: curl test round-trip
      pass_signal: |
        curl http://localhost:8000/v1/chat/completions \
          -H 'Content-Type: application/json' \
          -d '{"model":"gemma-4-26b-a4b","messages":[{"role":"user","content":"Reply with the single word: ok"}]}'
        returns response with content == "ok", usage.completion_tokens
        reasonable, round-trip < 3 s.
      fail_signal: curl 5xx, content != "ok", or round-trip ≥ 3 s
  on_failure:
    action: abort_day
    human_message: |
      vLLM did not come up cleanly with validated startup logs and curl
      response. This is the Day 1 hard checkpoint. Stop Block 2. Do NOT
      use afternoon to debug at the cost of tomorrow's Block 1. The agent
      writes day_aborted to the run log and halts.
      Common causes:
        - Pulled `:gemma4` instead of `:v0.20.0` → fix and retry
        - MARLIN flag did not pick up; log shows CUTLASS_FP4 → image
          version skew, file an issue, fall back to per-source
          troubleshooting
        - CUDA is 13.2 (should have been caught in firmware step) → roll
          back
  hard_checkpoint: true
  estimated_minutes: 40
  log_to: run_log

- task_id: day1_block2_bench
  type: agent_executable
  human_only: false
  description: |
    Tokens/sec micro-bench. 5-prompt sweep at 256 tok output target;
    record decode tok/s in `bench/day1.csv`. (Source 1:50–2:00.)
  preconditions:
    - day1_block2_vllm_serve
  command: |
    python3 scripts/bench_tokens_per_sec.py \
      --endpoint http://localhost:8000/v1 \
      --model gemma-4-26b-a4b \
      --num-prompts 5 \
      --max-tokens 256 \
      --output bench/day1.csv
  expected_observable:
    kind: metric_threshold
    value: |
      Single-stream decode tok/s in [50, 110] (matches public
      benchmarks; NVFP4 baseline calibration ~52 tok/s). Below 40 tok/s
      is a fault. (MTP deferred — see DECISIONS.md D-019; the 80–130
      band returns when MTP is enabled in Week 2+.)
  validation:
    - check: 5 rows recorded in bench/day1.csv
      pass_signal: `wc -l bench/day1.csv` returns 6 (header + 5 rows)
      fail_signal: any other count
    - check: median tok/s ≥ 40
      pass_signal: median of decode tok/s column ≥ 40
      fail_signal: median < 40
    - check: median tok/s in expected band [50, 110]
      pass_signal: median in [50, 110] — record to metric_log
      fail_signal: median outside band — informational, not fatal unless < 40
  on_failure:
    action: escalate_to_human
    human_message: |
      tok/s below 40. Investigate in this order:
        1. Filesystem cache full → run cache-clear cron manually.
        2. Thermal throttling → check thermal log.
        3. Confirm NVFP4 weights, not BF16, were loaded.
      Record investigation in notes/day1-bench-debug.md before retrying.
  hard_checkpoint: false
  estimated_minutes: 10
  log_to: run_log
  metric_log_key: day1_tokens_per_sec
