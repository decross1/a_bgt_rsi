<svg width="100%" viewBox="0 0 700 850" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Autonomous zone -->
<rect x="38" y="12" width="540" height="632" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="6 4"/>
<text x="308" y="32" text-anchor="middle" font-size="12" fill="#888780">Apparatus loop · runs on DGX Spark</text>

<!-- Step 1: Literature scan -->
<rect x="140" y="50" width="336" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="308" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">1. Literature scan</text>
<text x="308" y="88" text-anchor="middle" font-size="11" fill="#854F0B">arXiv nightly + Semantic Scholar + foundational corpus</text>

<line x1="308" y1="100" x2="308" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 2: Hypothesis -->
<rect x="140" y="124" width="336" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="308" y="144" text-anchor="middle" font-size="13" font-weight="500" fill="#3C3489">2. Generate hypothesis</text>
<text x="308" y="162" text-anchor="middle" font-size="11" fill="#534AB7">Synthesize literature + data → research question</text>

<line x1="308" y1="174" x2="308" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 3: Experiment -->
<rect x="140" y="198" width="336" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="308" y="218" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">3. Run experiment in one tier</text>
<text x="308" y="236" text-anchor="middle" font-size="11" fill="#0F6E56">Synthetic · semi-synthetic · or applied</text>

<!-- Autoresearch branch -->
<line x1="140" y1="223" x2="80" y2="223" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="80" y1="223" x2="80" y2="250" stroke="#888780" stroke-width="1"/>
<rect x="38" y="250" width="84" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="80" y="270" text-anchor="middle" font-size="10" font-weight="500" fill="#633806">Autoresearch</text>
<text x="80" y="280" text-anchor="middle" font-size="9" fill="#854F0B">if model needed</text>
<path d="M38 268 C18 268, 14 262, 14 256 C14 248, 26 248, 38 262" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="308" y1="248" x2="308" y2="272" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 4: Robustness battery -->
<rect x="140" y="272" width="336" height="50" rx="8" fill="#E8E6DF" stroke="#888780" stroke-width="0.5"/>
<text x="308" y="292" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">4. Robustness battery</text>
<text x="308" y="310" text-anchor="middle" font-size="11" fill="#5F5E5A">Vary prompt · seed · model version → does finding hold?</text>

<line x1="308" y1="322" x2="308" y2="346" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 5: Cross-tier replication (NEW) -->
<rect x="140" y="346" width="336" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="308" y="366" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">5. Cross-tier replication</text>
<text x="308" y="384" text-anchor="middle" font-size="11" fill="#0F6E56">Test finding in other tier(s) · does it generalize?</text>
<text x="308" y="398" text-anchor="middle" font-size="10" fill="#0F6E56">Tier-specific failure = diagnostic signal, not discard</text>

<line x1="308" y1="402" x2="308" y2="426" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 6: Novelty check -->
<rect x="140" y="426" width="336" height="62" rx="8" fill="#F5E6F9" stroke="#7B3F9E" stroke-width="0.5"/>
<text x="308" y="444" text-anchor="middle" font-size="13" font-weight="500" fill="#5B2D76">6. Novelty evaluation</text>
<text x="308" y="460" text-anchor="middle" font-size="11" fill="#7B3F9E">Check all 3 knowledge layers: foundational · live · loop memory</text>
<text x="308" y="476" text-anchor="middle" font-size="11" fill="#7B3F9E">Novel · rediscovery · nonsense · unclear</text>
<text x="308" y="488" text-anchor="middle" font-size="10" fill="#7B3F9E">Surface 5 most similar known results</text>

<line x1="308" y1="488" x2="308" y2="516" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Step 7: Log -->
<rect x="140" y="516" width="336" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="308" y="536" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">7. Log to research journal</text>
<text x="308" y="554" text-anchor="middle" font-size="11" fill="#185FA5">Claim · prior · search · assessment · what would change it</text>

<!-- Monthly red flags -->
<rect x="500" y="272" width="136" height="78" rx="6" fill="none" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="568" y="288" text-anchor="middle" font-size="10" fill="#993C1D">Monthly red flags:</text>
<text x="568" y="302" text-anchor="middle" font-size="10" fill="#993C1D">Reading w/o doing?</text>
<text x="568" y="316" text-anchor="middle" font-size="10" fill="#993C1D">Doing w/o thinking?</text>
<text x="568" y="330" text-anchor="middle" font-size="10" fill="#993C1D">Novel findings in 30d?</text>
<text x="568" y="344" text-anchor="middle" font-size="10" fill="#993C1D">Am I the bottleneck?</text>
<line x1="476" y1="297" x2="500" y2="297" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Cross-tier annotation -->
<rect x="500" y="366" width="136" height="34" rx="6" fill="none" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="568" y="380" text-anchor="middle" font-size="10" fill="#0F6E56">Strongest signal:</text>
<text x="568" y="394" text-anchor="middle" font-size="10" fill="#0F6E56">succeeds in one, fails</text>
<line x1="476" y1="378" x2="500" y2="378" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Autonomy boundary -->
<line x1="38" y1="660" x2="662" y2="660" stroke="#888780" stroke-width="1" stroke-dasharray="8 4"/>
<text x="350" y="680" text-anchor="middle" font-size="12" fill="#888780">Human judgment required below</text>

<line x1="308" y1="566" x2="308" y2="700" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Human review -->
<rect x="120" y="700" width="460" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="350" y="722" text-anchor="middle" font-size="13" font-weight="500" fill="#712B13">8. Human evaluation</text>
<text x="350" y="738" text-anchor="middle" font-size="11" fill="#993C1D">Validate novelty assessment · approve trade · update rubric</text>
<text x="350" y="754" text-anchor="middle" font-size="11" fill="#993C1D">Publish to journal · cold-email experts if warranted</text>

<!-- Return loop -->
<path d="M120 730 L34 730 L34 78 L138 78" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="20" y="400" text-anchor="middle" font-size="12" fill="#888780" transform="rotate(-90, 20, 400)">Continuous loop</text>

<!-- FEEDBACK LOOP: Human assessment → knowledge base (NEW) -->
<path d="M580 730 L636 730 L636 78 L580 78" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="652" y="400" text-anchor="middle" font-size="11" fill="#993C1D" transform="rotate(90, 652, 400)">Assessments → loop memory in knowledge base</text>

<!-- Legend -->
<text x="38" y="800" font-size="11" fill="#888780">Steps 5 + feedback loop are new: cross-tier replication tests generalizability,</text>
<text x="38" y="818" font-size="11" fill="#888780">human assessments feed back into knowledge base so loop doesn't rediscover known results</text>
</svg>
